name: Generate Pac-Man Contribution Graph

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/pacman-contribution-graph.svg?palette=github&color_snake=#FFD700
            assets/pacman-contribution-graph-dark.svg?palette=github-dark&color_snake=#FFD700

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Pac-Man contribution graph"
          branch: main
