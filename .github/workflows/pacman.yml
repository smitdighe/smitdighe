name: pacman

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pacman
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          games: pacman
          player_style: opportunistic
          hide_month_labels: "false"

      - name: Move SVGs into assets
        run: |
          mkdir -p assets
          mv dist/pacman-contribution-graph.svg assets/pacman-contribution-graph.svg
          mv dist/pacman-contribution-graph-dark.svg assets/pacman-contribution-graph-dark.svg

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/pacman-contribution-graph.svg assets/pacman-contribution-graph-dark.svg
          if git diff --staged --quiet; then
            echo "no changes"
          else
            git commit -m "chore: update pacman contribution graph"
            git push
          fi
