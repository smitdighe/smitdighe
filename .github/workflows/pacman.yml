name: Generate Pac-Man Contribution Graph
on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  generate-pacman:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contributions and generate Pac-Man SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests --quiet
          python3 << 'EOF'
          import requests, os

          username = os.environ.get("GITHUB_REPOSITORY_OWNER", "smitdighe")
          token = os.environ["GITHUB_TOKEN"]

          headers = {"Authorization": f"bearer {token}"}
          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      contributionCount
                      date
                    }
                  }
                }
              }
            }
          }
          """
          r = requests.post("https://api.github.com/graphql",
              json={"query": query, "variables": {"login": username}},
              headers=headers)
          weeks = r.json()["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          cell = 11
          gap = 3
          step = cell + gap
          pad_left = 20
          pad_top = 20
          cols = len(weeks)
          rows = 7
          W = pad_left + cols * step + 20
          H = pad_top + rows * step + 20

          def color(count):
              if count == 0: return "#161b22"
              if count < 3: return "#0e4429"
              if count < 6: return "#006d32"
              if count < 9: return "#26a641"
              return "#39d353"

          # Build all cells with IDs for eaten animation
          cells_svg = ""
          for wi, week in enumerate(weeks):
              for di, day in enumerate(week["contributionDays"]):
                  x = pad_left + wi * step
                  y = pad_top + di * step
                  c = color(day["contributionCount"])
                  cid = f"c{wi}_{di}"
                  # Each cell fades out when pacman reaches it (on row 3)
                  if di == 3 and day["contributionCount"] > 0:
                      delay = wi * 0.12
                      total = cols * 0.12 + 1
                      cells_svg += f'''<rect id="{cid}" x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{c}">
                        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;{delay/total:.3f};{(delay+0.05)/total:.3f};1" dur="{total:.1f}s" repeatCount="indefinite"/>
                      </rect>\n'''
                  else:
                      cells_svg += f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{c}"/>\n'

          # Pac-Man travels across row 3
          pac_row = 3
          pac_y = pad_top + pac_row * step + cell // 2
          pac_start = pad_left - 15
          pac_end = pad_left + cols * step + 5
          duration = cols * 0.12 + 1

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" style="background:#0d1117">
          {cells_svg}
          <g>
            <circle cx="0" cy="{pac_y}" r="7" fill="#FFD700">
              <animateTransform attributeName="transform" type="translate"
                values="{pac_start},0;{pac_end},0"
                dur="{duration:.1f}s" repeatCount="indefinite"/>
            </circle>
            <circle cx="0" cy="{pac_y - 3}" r="1.5" fill="#0d1117">
              <animateTransform attributeName="transform" type="translate"
                values="{pac_start},0;{pac_end},0"
                dur="{duration:.1f}s" repeatCount="indefinite"/>
            </circle>
          </g>
          </svg>'''

          os.makedirs("assets", exist_ok=True)
          with open("assets/pacman-contribution-graph-dark.svg", "w") as f:
              f.write(svg)
          print("Done!")
          EOF

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Pac-Man contribution graph"
          branch: main
