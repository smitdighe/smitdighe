<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 330" width="940" height="330" role="img" aria-label="FinDocAgent multi-agent pipeline">
<style>
  .fg    { fill: #1f2328; }
  .muted { fill: #59636e; }
  .card  { fill: #ffffff; stroke: #d1d9e0; }
  .wire  { stroke: #d1d9e0; }
  @media (prefers-color-scheme: dark) {
    .fg    { fill: #e6edf3; }
    .muted { fill: #9198a1; }
    .card  { fill: #161b22; stroke: #30363d; }
    .wire  { stroke: #30363d; }
  }
  .t { font-family: ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace; }
</style>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0,0 L10,5 L0,10 z" fill="#FF7B54" opacity="0.75"/>
  </marker>
  <path id="pipe" d="M100,152 L820,152"/>
</defs>

<text class="t fg" x="20" y="30" font-size="15" font-weight="700">FinDocAgent &#183; multi-agent RAG over SEC filings</text>

<!-- wires -->
<line x1="182" y1="152" x2="198" y2="152" class="wire" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="362" y1="152" x2="378" y2="152" class="wire" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="542" y1="152" x2="558" y2="152" class="wire" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="722" y1="152" x2="738" y2="152" class="wire" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M460,250 L460,190" class="wire" stroke-width="2" fill="none" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<!-- packet travelling down the pipeline -->
<circle r="5" fill="#FF7B54">
  <animateMotion dur="10s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
    <mpath href="#pipe"/>
  </animateMotion>
  <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.92;1" dur="10s" repeatCount="indefinite"/>
</circle>

<!-- node 1 -->
<g>
  <rect x="20" y="120" width="160" height="64" rx="10" class="card" stroke-width="1.5"/>
  <rect x="20" y="120" width="160" height="64" rx="10" fill="none" stroke="#FF7B54" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.03;0.16;0.22;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="t fg" x="100" y="148" font-size="13" font-weight="700" text-anchor="middle">Query</text>
  <text class="t muted" x="100" y="166" font-size="10.5" text-anchor="middle">user question</text>
</g>

<!-- node 2 -->
<g>
  <rect x="200" y="120" width="160" height="64" rx="10" class="card" stroke-width="1.5"/>
  <rect x="200" y="120" width="160" height="64" rx="10" fill="none" stroke="#FF7B54" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.20;0.24;0.36;0.42;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="t fg" x="280" y="148" font-size="13" font-weight="700" text-anchor="middle">Router</text>
  <text class="t muted" x="280" y="166" font-size="10.5" text-anchor="middle">plans the hops</text>
</g>

<!-- node 3 -->
<g>
  <rect x="380" y="120" width="160" height="64" rx="10" class="card" stroke-width="1.5"/>
  <rect x="380" y="120" width="160" height="64" rx="10" fill="none" stroke="#FF7B54" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.40;0.44;0.56;0.62;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="t fg" x="460" y="148" font-size="13" font-weight="700" text-anchor="middle">Retriever</text>
  <text class="t muted" x="460" y="166" font-size="10.5" text-anchor="middle">hybrid search</text>
</g>

<!-- node 4 -->
<g>
  <rect x="560" y="120" width="160" height="64" rx="10" class="card" stroke-width="1.5"/>
  <rect x="560" y="120" width="160" height="64" rx="10" fill="none" stroke="#FF7B54" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.60;0.64;0.76;0.82;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="t fg" x="640" y="148" font-size="13" font-weight="700" text-anchor="middle">Analyst</text>
  <text class="t muted" x="640" y="166" font-size="10.5" text-anchor="middle">reasons, verifies</text>
</g>

<!-- node 5 -->
<g>
  <rect x="740" y="120" width="180" height="64" rx="10" class="card" stroke-width="1.5"/>
  <rect x="740" y="120" width="180" height="64" rx="10" fill="none" stroke="#FF7B54" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.80;0.84;0.97;1" dur="10s" repeatCount="indefinite"/>
  </rect>
  <text class="t fg" x="830" y="148" font-size="13" font-weight="700" text-anchor="middle">Cited answer</text>
  <text class="t muted" x="830" y="166" font-size="10.5" text-anchor="middle">source-linked</text>
</g>

<!-- store -->
<g>
  <rect x="360" y="250" width="200" height="56" rx="10" class="card" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="t fg" x="460" y="274" font-size="12.5" font-weight="700" text-anchor="middle">Vector store</text>
  <text class="t muted" x="460" y="292" font-size="10.5" text-anchor="middle">chunked 10-K / 10-Q</text>
  <circle cx="378" cy="266" r="4" fill="#FF7B54">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</g>
</svg>
